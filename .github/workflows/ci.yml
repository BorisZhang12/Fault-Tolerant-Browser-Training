name: CI
on: [push, pull_request]
jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: coordinator/go.mod }
      - run: cd coordinator && go vet ./... && go test ./...
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd worker && npm install && npm test && npm run build
