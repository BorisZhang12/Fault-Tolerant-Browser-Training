name: CI
on: [push, pull_request]
jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: coordinator/go.mod }
      - run: cd coordinator && go vet ./... && go test ./...
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd worker && npm install && npm test && npm run build

  # Guards milestone 2's done line: the worker decodes the shards the Go
  # coordinator serves and trains on them to a real accuracy. Reduced from the
  # full 5 epochs because CI has no GPU and runs on the CPU backend.
  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: coordinator/go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download MNIST
        run: cd coordinator && go run ./cmd/fetch-mnist -dir ../data/mnist
      - name: Start the coordinator
        run: |
          cd coordinator && go build -o bin/coordinator ./cmd/coordinator
          ./bin/coordinator -addr :8080 -run-id ci &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8080/shards/0 && exit 0; sleep 1; done
          echo "coordinator did not come up" >&2 && exit 1
      - name: Train one epoch over 20 shards
        run: cd worker && npm install && npx vitest run src/mnist.e2e.test.ts
        env:
          COORDINATOR_URL: http://localhost:8080
          E2E_EPOCHS: 1
          E2E_SHARDS: 20
          E2E_MIN_ACCURACY: 0.88
